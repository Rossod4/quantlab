[project]
name = "quantlab"
version = "0.1.0"
description = "Bias-free systematic trading strategy research platform (EOD US equities)"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "pydantic>=2.7",
    "pyyaml>=6",
    "exchange-calendars>=4.5",
    "requests>=2.32",
    "yfinance>=0.2.40",
    "typer>=0.12",
    "jinja2>=3.1",
    "matplotlib>=3.9",
    "scipy>=1.13",
]

[project.optional-dependencies]
paper = ["alpaca-py>=0.21"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "pytest-cov>=5"]

[project.scripts]
quantlab = "quantlab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "NPY", "PD"]
ignore = ["PD901"]  # generic df names are fine internally

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not network'"
markers = [
    "network: touches live APIs (excluded by default; run explicitly)",
]
